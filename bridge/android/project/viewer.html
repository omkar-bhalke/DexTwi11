<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Android application analysis · REA</title>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#17352d;background:#f6f7f2}*{box-sizing:border-box}body{margin:0}header{background:#173c32;color:white;padding:28px max(5vw,20px)}h1{font-size:clamp(23px,4vw,38px);margin:4px 0 12px;overflow-wrap:anywhere}header p{margin:4px 0;color:#e1ebe4}main{max-width:1600px;margin:auto;display:grid;grid-template-columns:minmax(195px,245px) 1fr;gap:28px;padding:24px 5vw}nav{display:flex;flex-direction:column;align-items:stretch;gap:3px}button,select,input{font:inherit}button{cursor:pointer}nav button{background:transparent;text-align:left;border:0;border-radius:4px;padding:7px 10px;color:inherit}nav [aria-current=true]{background:#d7e9db;font-weight:650}.bar{display:flex;gap:8px;flex-wrap:wrap}input,select,.page{color:inherit;background:white;border:1px solid #b9c5b8;border-radius:5px;padding:7px}.bar input{flex:1;min-width:160px}h2{margin-top:4px}section{min-width:0}article{background:white;border:1px solid #d8dfd4;border-radius:6px;padding:10px 13px;margin-bottom:7px}summary{cursor:pointer;overflow-wrap:anywhere;font-weight:550}pre,code{white-space:pre-wrap;overflow-wrap:anywhere}pre{font-size:12px}.muted{color:#4c665c}.pager{display:flex;align-items:center;gap:12px;margin:10px 0}.page:disabled{opacity:.5}a{color:inherit}footer{padding:14px 5vw 28px;color:#405e52}footer p{max-width:95ch}#digest{font-family:monospace;overflow-wrap:anywhere}@media(max-width:760px){main{display:block}nav{display:none}#sectionSelect{width:100%;margin-bottom:16px}}@media(min-width:761px){#sectionSelect{display:none}}
</style>
<header><p>REA / Android project report</p><h1 id="title"></h1><p id="metrics"></p></header>
<main><nav aria-label="Report sections" id="nav"></nav><section><select id="sectionSelect" aria-label="Report section"></select>
<h2 id="heading"></h2><p id="note"></p><div class="bar"><input id="search" name="search" type="search" placeholder="Search this section" aria-label="Search this section"><select id="status" aria-label="Analysis status"><option value="">All statuses</option></select></div><div class="pager"><button class="page" id="prev">Previous</button><span id="range" aria-live="polite"></span><button class="page" id="next">Next</button></div><div id="rows"></div></section></main>
<footer><strong>Reconstruction decision pending</strong><p>Would you like to begin authorized application reconstruction? Review or export this report, then record YES or NO using the project CLI.</p><span>Reviewed report SHA-256 </span><span id="digest"></span></footer>
<script type="application/json" id="snapshot">{{PAYLOAD}}</script>
<script>
"use strict";
const by=id=>document.getElementById(id), payload=JSON.parse(by("snapshot").textContent), r=payload.report, sections=payload.sections;
const groups=new Map(), add=(kind,row)=>{if(!groups.has(kind))groups.set(kind,[]);groups.get(kind).push(row)};
payload.trees.forEach(x=>add("hierarchy",x));r.files.forEach(x=>add("files",x));r.observations.forEach(x=>add(x.category,x));r.limitations.forEach(x=>add("limitations",x));
r.files.forEach(x=>add("rights",{location:x.location,status:x.reuse,evidence:x.id}));r.reconstruction_plan.forEach(x=>add("plan",{location:x}));add("coverage",{location:"Analysis scope",...r.coverage});add("package",{location:"Selected input",...r.target});
const pkg=r.observations.find(x=>x.category==="package"&&!x.data.split);const label=pkg?.data.default_label||pkg?.data.label;by("title").textContent=(label&&label!=="[withheld]"&&!label.startsWith("@"))?label:r.target.name;by("metrics").textContent=r.target.format.toUpperCase()+" · "+r.files.length.toLocaleString()+" file occurrences · "+r.observations.length.toLocaleString()+" observations";by("digest").textContent=payload.digest;
let current=0,page=0,selected=[];
function render(){let list=selected;const query=by("search").value.trim().toLowerCase(),status=by("status").value;
if(status||query)list=list.filter(x=>(!status||x.status===status)&&(!query||JSON.stringify(x).toLowerCase().includes(query)));
const size=40,start=page*size;by("prev").disabled=page===0;by("next").disabled=start+size>=list.length;by("range").textContent=list.length?(start+1)+"–"+Math.min(start+size,list.length)+" of "+list.length:"No matching observations";
by("rows").replaceChildren();for(const x of list.slice(start,start+size)){const card=document.createElement("article"),d=document.createElement("details"),s=document.createElement("summary"),p=document.createElement("pre");s.textContent=(x.category?x.category+" · ":"")+x.location+(x.status?" · "+x.status:"");p.textContent=x.tree?x.tree.join("\n")+"\n\nEvidence "+x.evidence:JSON.stringify(x,null,2);d.append(s,p);card.append(d);by("rows").append(card)}}
function choose(i){current=i;page=0;const [title,keys,note]=sections[i];by("heading").textContent=title;by("note").textContent=note;by("sectionSelect").value=i;by("search").value="";by("status").value="";[...by("nav").children].forEach((n,k)=>n.setAttribute("aria-current",String(k===i)));selected=keys.split(" ").flatMap(k=>groups.get(k)||[]);render()}
sections.forEach(([name],i)=>{const b=document.createElement("button");b.textContent=name;b.onclick=()=>choose(i);by("nav").append(b);by("sectionSelect").add(new Option(name,i))});
[...new Set([...r.files,...r.observations,...r.limitations].map(x=>x.status).concat("REQUIRES_USER_INPUT"))].sort().forEach(s=>by("status").add(new Option(s,s)));
by("sectionSelect").onchange=e=>choose(Number(e.target.value));by("search").oninput=by("status").onchange=()=>{page=0;render()};by("prev").onclick=()=>{page--;render()};by("next").onclick=()=>{page++;render()};choose(0);
</script></html>
